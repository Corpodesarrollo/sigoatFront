<div class="p-4">
  <div class="container-fluid">
      <!-- Red Social -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label for="menu" class="fw-bold">Red Social</label>
        </div>
        <div class="col-md-9 p-fluid">
          <p-dropdown
            [(ngModel)]="selectedRedSocial"
            [options]="tiposRedesSociales"
            optionLabel="nombre"
            [filter]="true"
            filterBy="nombre"
            [showClear]="true"
            id="menu"
            class="w-100"
            placeholder="Seleccione">
          </p-dropdown>
          <div *ngIf="submitted && (!selectedRedSocial)" class="text-danger">
              Campo requerido
          </div>
        </div>
      </div>

      <!-- url -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="url">Url</label>
        </div>
        <div class="col-md-9">
          <input pInputText type="text" id="url" [(ngModel)]="formulario.url" class="w-100" />
          <div *ngIf="submitted && (!formulario.url || formulario.url.trim() === '')" class="text-danger">
              Campo requerido
          </div>
        </div>
      </div>

       <!-- Imagen -->
      <div class="row mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="imagen">Imagen</label>
        </div>
        <div class="col-md-9">
          <p-fileUpload
            name="imagen"
            [auto]="true"
            [maxFileSize]="1000000"
            [accept]="'.png,.jpg,.jpeg'"
            (onSelect)="onFileSelect($event)"
            [showUploadButton]="false"
            [showCancelButton]="false"
            [chooseLabel]="'Seleccionar Imagen'"
            [style]="{'width': '100%'}"
            [styleClass]="'w-100'">
          </p-fileUpload>
        </div>
      </div>

      <!-- Botones -->
      <div class="row mt-3">
        <div class="col-md-12 text-end">
          <button type="button" (click)="cancelar()" class="btn button-secondary btn-lg add-button me-2">Cancelar</button>
          <button type="button" (click)="onSubmit()" class="btn button-success btn-lg add-button">Guardar</button>
        </div>
      </div>
    </div>
</div>

<app-msg-box
  [visible]="visible"
  [msgTexto]="msg"
  [msgTipo]="MsgTipo.Success"
  [error]="error"
  [width]="'25vw'"
  (close)="onHide($event)">
