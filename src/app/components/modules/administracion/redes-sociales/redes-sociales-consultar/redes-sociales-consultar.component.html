<div class="p-5">
    <div class="header-container mb-5 align-items-center">
        <h1>Administración de Redes Sociales</h1>
        <button (click)="agregar()" class="btn button-success btn-lg add-button" *ngIf="permisoCrear | async">
            <i class="pi pi-plus"></i> Agregar
        </button>
    </div>
  
    <p-table 
        [value]="pages" 
        [paginator]="true" 
        [rows]="rowsPerPage"
        [totalRecords]="totalRecords"
        [lazy]="true"
        (onLazyLoad)="loadPages($event)"
        [loading]="loading"
        [rowsPerPageOptions]="[5,10,20,50]"
        styleClass="custom-table">
        
    <ng-template pTemplate="header">
      <tr class="custom-header">
        <th>Nombre</th>
        <th>Url</th>
        <th>Imagen</th>
        <th class="text-center" style="width: 150px;">Acciones</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-page>
      <tr class="custom-row">
        <td><img [src]="'img/icons/icons8-' + cargarData(page.idTipoRedSocial) + '-24.png'" 
                [alt]="page.nombre"
                style="width: 18px; height: 18px; object-fit: contain; margin-right: 8px;"> {{cargarData(page.idTipoRedSocial)}}</td>
        <td>{{page.url}}</td>
        <td>
          <img [src]="cargarUrl(page.idImagen)" alt="Imagen" class="img-thumbnail" />
        </td>
        
        <td>
          <div style="display: flex; justify-content: center; align-items: center; gap: 0.5rem;">
            <i class="pi pi-pencil action-icon edit-icon" 
              (click)="edit(page)" *ngIf="permisoEditar | async"
              pTooltip="Editar" 
              tooltipPosition="top"></i>
            
            <i class="pi pi-trash action-icon delete-icon" 
              (click)="confirmDelete($event, page.id)" *ngIf="permisoEliminar | async"
              pTooltip="Eliminar" 
              tooltipPosition="top"></i>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-toast />

<app-msg-box
  [visible]="visible"
  [msgTexto]="msg"
  [msgTipo]="MsgTipo.Question"
  [msgBotones]="MsgBotones.EliminarCancelar"
  [width]="'25vw'"
  (close)="onHide($event)">
