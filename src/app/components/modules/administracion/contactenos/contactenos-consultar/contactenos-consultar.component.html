<div class="p-5">
    <div class="header-container mb-5 align-items-center">
        <h1>Consultas Ciudadanas</h1>
    </div>
  
    <p-table 
        [value]="pages" 
        [paginator]="true" 
        [rows]="rowsPerPage"
        [totalRecords]="totalRecords"
        [lazy]="true"
        (onLazyLoad)="loadPages($event)"
        [loading]="loading"
        [rowsPerPageOptions]="[5,10,20,50]"
        styleClass="custom-table">
        
    <ng-template pTemplate="header">
      <tr class="custom-header">
        <th>Nombre Completo</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th>Asunto</th>
        <th class="text-center" style="width: 150px;">Acciones</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-page>
      <tr class="custom-row">
        <td>{{page.nombreCompleto}}</td>
        <td>{{page.email}}</td>
        <td>{{page.telefono}}</td>
        <td>{{page.asunto}}</td>
        <td>
          <div style="display: flex; justify-content: center; align-items: center; gap: 0.5rem;">
            <i class="pi pi-info action-icon edit-icon" 
              (click)="info(page)" 
              pTooltip="Editar" 
              tooltipPosition="top"></i>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="displayModal" [modal]="true" [closable]="true" header="Consulta Ciudadana" [style]="{ width: '500px' }">
    <div class="p-4">
        <div class="container-fluid">
        <!-- Nombre -->
            <div class="row align-items-center mb-3 p-fluid">
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-0" for="nombre">Nombre</label>
                </div>
                <div class="col-md-9">
                    <input pInputText type="text" id="nombre" [(ngModel)]="formulario.nombreCompleto" class="w-100" disabled />
                </div>
            </div>

            <div class="row align-items-center mb-3 p-fluid">
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-0" for="email">Email</label>
                </div>
                <div class="col-md-9">
                    <input pInputText type="text" id="email" [(ngModel)]="formulario.email" class="w-100" disabled />
                </div>
            </div>

            <div class="row align-items-center mb-3 p-fluid">
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-0" for="telefono">Teléfono</label>
                </div>
                <div class="col-md-9">
                    <input pInputText type="text" id="telefono" [(ngModel)]="formulario.telefono" class="w-100" disabled />
                </div>
            </div>
            <div class="row align-items-center mb-3 p-fluid">
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-0" for="asunto">Asunto</label>
                </div>
                <div class="col-md-9">
                    <input pInputText type="text" id="asunto" [(ngModel)]="formulario.asunto" class="w-100" disabled />
                </div>
            </div>
            <div class="row align-items-center mb-3 p-fluid">
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-0" for="mensaje">Mensaje</label>
                </div>
                <div class="col-md-9">
                    <textarea pInputText id="mensaje" [(ngModel)]="formulario.mensaje" rows="5" class="w-100" disabled></textarea>
                </div>
            </div>
        </div>
    </div>
</p-dialog>

<p-toast />

<app-msg-box
  [visible]="visible"
  [msgTexto]="msg"
  [msgTipo]="MsgTipo.Question"
  [msgBotones]="MsgBotones.EliminarCancelar"
  [width]="'25vw'"
  (close)="onHide($event)">
