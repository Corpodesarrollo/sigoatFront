<div class="p-5">
    <div class="header-container mb-5 align-items-center">
        <h1>Administración de Páginas</h1>
        <button (click)="agregar()" class="btn button-success btn-lg add-button" *ngIf="permisoCrear | async">
            <i class="pi pi-plus"></i> Agregar
        </button>
    </div>
  
    <p-table 
        [value]="pages" 
        [paginator]="true" 
        [rows]="rowsPerPage"
        [totalRecords]="totalRecords"
        [lazy]="true"
        (onLazyLoad)="loadPages($event)"
        [loading]="loading"
        [rowsPerPageOptions]="[5,10,20,50]"
        styleClass="custom-table">
        
    <ng-template pTemplate="header">
      <tr class="custom-header">
        <th>Idioma</th>
        <th>Título</th>
        <th>Detalle</th>
        <th>Url</th>
        <th class="text-center" style="width: 120px;">Estado</th>
        <th class="text-center" style="width: 150px;">Acciones</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-page>
      <tr class="custom-row">
        <td>{{page.idioma}}</td>
        <td>{{page.titulo}}</td>
        <td>{{page.detalle}}</td>
        <td>{{page.url}}</td>
        <td class="text-center">
          <span [class]="'status-badge status-' + (page.estado ? 'activo' : 'inactivo')">
            {{page.estado ? '● Activo' : '● Inactivo'}}
          </span>
        </td>
        <td>
          <div style="display: flex; justify-content: center; align-items: center; gap: 0.5rem;">
            <i class="pi pi-book action-icon create-icon" 
               (click)="mostrarMenu($event, page.id)"
              pTooltip="Noticias" 
              tooltipPosition="top"></i>
            
            <i class="pi pi-pencil action-icon edit-icon" 
              (click)="edit(page)"  *ngIf="permisoEditar | async"
              pTooltip="Editar" 
              tooltipPosition="top"></i>
            
            <i class="pi pi-trash action-icon delete-icon" 
              (click)="confirmDelete($event, page.id)" *ngIf="permisoEliminar | async"
              pTooltip="Eliminar" 
              tooltipPosition="top"></i>

            <img id="icono-{{page.id}}" [src]="cargarIcono(page.estado)" style="width: 48px; cursor: pointer;" (click)="onToggleChange(page)" pTooltip="{{validarEstado(!page.estado)}}" tooltipPosition="top" />
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-menu #menu [popup]="true" [model]="items"></p-menu>
<p-toast />

<app-msg-box
  [visible]="visible"
  [msgTexto]="msg"
  [msgTipo]="msgTipo"
  [msgBotones]="msgBotones"
  [width]="'25vw'"
  (close)="onHide($event)">
