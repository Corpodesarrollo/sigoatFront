<div class="p-4">
  <div class="container-fluid">
      <!-- idiomas -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="nombre">Nombre</label>
        </div>
        <div class="col-md-9">
            <p-dropdown
                [(ngModel)]="selectedIdioma"
                [options]="idiomas"
                [loading]="isLoadingIdiomas"
                optionLabel="nombre"
                [filter]="true"
                filterBy="nombre"
                [showClear]="true"
                id="idiomas"
                class="w-100"
                placeholder="Seleccione"/>
            <div *ngIf="submitted && !(formulario.idioma === '')" class="text-danger">
                Campo requerido
            </div>
        </div>
      </div>

      <!-- titulo -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="titulo">Título</label>
        </div>
        <div class="col-md-9">
          <input pInputText type="text" id="titulo" [(ngModel)]="formulario.titulo" class="w-100" />
        </div>
      </div>

      <!-- Detalle -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="Detalle">Detalle</label>
        </div>
        <div class="col-md-9">
          <input pInputText type="text" id="Detalle" [(ngModel)]="formulario.detalle" class="w-100" />
        </div>
      </div>

      <!-- Url -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="Url">Url</label>
        </div>
        <div class="col-md-9">
          <input pInputText type="text" id="Url" [(ngModel)]="formulario.url" class="w-100" />
        </div>
      </div>

      <!-- Estado -->
      <div class="row align-items-center mb-5 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="estado">Estado</label>
        </div>
        <div class="col-md-9">
          <p-inputSwitch [(ngModel)]="formulario.estado" class="custom-switch" />
        </div>
      </div>

      <!-- Botones -->
      <div class="row mt-3">
        <div class="col-md-12 text-end">
          <button type="button" (click)="cancelar()" class="btn button-secondary btn-lg add-button me-2">Cancelar</button>
          <button type="button" (click)="onSubmit()" class="btn button-success btn-lg add-button2">Guardar y Continuar</button>
        </div>
      </div>
    </div>
</div>

<app-msg-box
  [visible]="visible"
  [msgTexto]="msg"
  [msgTipo]="MsgTipo.Success"
  [error]="error"
  [width]="'25vw'"
  (close)="onHide($event)">
