<div class="p-3">
    <div class="row">
      <div class="col-12">
        <app-steps [stepsCount]="5" [activeIndex]="1" />
      </div>
    </div>
    <div class="header-container mb-2 align-items-center">
      <div class="col-auto">
        <h1>Administración del Carrusel de Imágenes</h1>
      </div>
      <div class="col-auto">
        <button (click)="displayViewer = true" class="btn button-secondary btn-lg me-2" type="button" *ngIf="permisoCrear | async">
            <i class="pi pi-eye"></i> Preview
        </button>
        <button (click)="agregar()" class="btn button-success btn-lg add-button" type="button" *ngIf="permisoCrear | async">
            <i class="pi pi-plus"></i> Agregar
        </button>
      </div>
    </div>

    <div class="row mb-3 align-items-center">
      <div class="col-auto">
        Página:
      </div>
      <div class="col-auto d-flex align-items-center">
        <h2 class="mb-0">{{ tituloPagina }}</h2>
      </div>
    </div>
      
    <p-table 
        [value]="pages" 
        [paginator]="true" 
        [rows]="rowsPerPage"
        [totalRecords]="totalRecords"
        [loading]="loading"
        [rowsPerPageOptions]="[5,10,20,50]"
        styleClass="custom-table">
        
    <ng-template pTemplate="header">
      <tr class="custom-header">
        <th style="width: 150px;">Imagen</th>
        <th class="text-center" style="width: 150px;">Orden</th>
        <th>Url</th>
        <th class="text-center" style="width: 200px;">Acciones</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-page>
      <tr class="custom-row">
        <td>
          <img *ngIf="!page.url" [src]="cargarUrl(page.id)" alt="Imagen" class="img-thumbnail" />
          <img *ngIf="page.url" [src]="page.url" alt="Imagen" class="img-thumbnail" />
        </td>
        <td class="text-center">{{page.orden}}</td>
        <td>{{page.url}}</td>
        <td>
          <div style="display: flex; justify-content: center; align-items: center; gap: 0.5rem;">
            <i 
              class="pi pi-chevron-up action-icon text-warning fw-bold" 
              (click)="cambiarOrden(page.id, 'up')" *ngIf="permisoEditar | async"
              pTooltip="Subir" 
              tooltipPosition="top"
              [ngClass]="{'disabled-icon': pages[0].id === page.id}"
              [style.pointerEvents]="pages[0].id === page.id ? 'none' : 'auto'"
              [style.opacity]="pages[0].id === page.id ? 0.5 : 1"
            ></i>
            
            <i 
              class="pi pi-chevron-down action-icon text-warning fw-bold" 
              (click)="cambiarOrden(page.id, 'down')" *ngIf="permisoEditar | async"
              pTooltip="Bajar" 
              tooltipPosition="top"
              [ngClass]="{'disabled-icon': pages[pages.length - 1].id === page.id}"
              [style.pointerEvents]="pages[pages.length - 1].id === page.id ? 'none' : 'auto'"
              [style.opacity]="pages[pages.length - 1].id === page.id ? 0.5 : 1"
            ></i>

            <i class="pi pi-trash action-icon delete-icon" 
              (click)="confirmDelete($event, page.id)" *ngIf="permisoEliminar | async"
              pTooltip="Eliminar" 
              tooltipPosition="top"></i>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div class="row">
    <div class="col-12 text-center">
      <button (click)="anterior()" class="btn button-secondary btn-lg add-button text-white me-2" type="button">
        <i class="pi pi-chevron-left"></i> Anterior
      </button>
      <button (click)="continuar()" class="btn button-success btn-lg add-button" type="button">
        <i class="pi pi-chevron-right"></i> Continuar
      </button>
    </div>
</div>

<p-dialog [(visible)]="displayModal" [modal]="true" [closable]="true" header="Agregar Imagen al Carrusel" [style]="{ width: '500px' }">
    <div class="info-carga mb-3">
        <ul>
            <li>Cargar archivo JPG, JPEG o PNG.</li>
            <li>Tamaño máximo de 4MB.</li>
            <li>Dimensiones recomendadas: <br>640 x 400.</li>
        </ul>
        <div class="preview-imagen">
            <img *ngIf="imagenPreview" [src]="imagenPreview" alt="Vista previa" />
        </div>
    </div>

    <div *ngIf="mensajeError" class="mensaje-error text-center mb-2">
        {{ mensajeError }}
    </div>

    <div *ngIf="nombre" class="nombre-imagen text-center mb-2">
        {{ nombre }}
    </div>

    <div class="mb-3">
        <input pInputText type="text" id="0" [(ngModel)]="urlImagen" (blur)="validarImagen(urlImagen)" class="w-100" placeholder="Ingrese URL opcional" />
    </div>
    
    <div class="card-contenedor">
        <div class="archivo-section">
            <label class="btn-archivo">
                <i class="pi pi-folder-open"></i> Seleccione archivo
                <input id="archivo" type="file" (change)="onArchivoSeleccionado($event)" #fileInput style="display: none;" accept=".jpg, .jpeg, .png, .gif" />
            </label>

            <button class="btn-subir" (click)="subirArchivo()" [disabled]="!archivoSeleccionado && !urlImagen">
                <i class="pi pi-upload"></i> Subir archivo
            </button>
        </div>
    </div>
</p-dialog>

<p-dialog [(visible)]="displayViewer" [modal]="true" [closable]="true" (onHide)="displayViewer = false" header="Vista Previa" [style]="{ width: '80vw', height: '80vh' }">
  <app-viewer [id]="this.id"></app-viewer>
</p-dialog>

<p-toast />

<app-msg-box
  [visible]="visible"
  [msgTexto]="msg"
  [msgTipo]="MsgTipo.Question"
  [msgBotones]="MsgBotones.EliminarCancelar"
  [width]="'25vw'"
  (close)="onHide($event)">
