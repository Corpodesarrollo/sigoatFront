<div class="p-3">
    <div class="row">
      <div class="col-12">
        <app-steps [stepsCount]="5" [activeIndex]="3" />
      </div>
    </div>
    <div class="header-container mb-2 align-items-center">
      <div class="col-auto">
        <h1>Administración de Noticias</h1>
      </div>
      <div class="col-auto">
        <button (click)="displayViewer = true" class="btn button-secondary btn-lg me-2" type="button" *ngIf="permisoCrear | async">
            <i class="pi pi-eye"></i> Preview
        </button>
        <button (click)="agregar()" class="btn button-success btn-lg add-button" type="button" *ngIf="permisoCrear | async">
            <i class="pi pi-plus"></i> Agregar
        </button>
      </div>
    </div>

    <div class="row mb-3 align-items-center">
      <div class="col-auto">
        Página:
      </div>
      <div class="col-auto d-flex align-items-center">
        <h2 class="mb-0">{{ tituloPagina }}</h2>
      </div>
    </div>
      
    <p-table 
        [value]="pages" 
        [paginator]="true" 
        [rows]="rowsPerPage"
        [totalRecords]="totalRecords"
        [loading]="loading"
        [rowsPerPageOptions]="[5,10,20,50]"
        styleClass="custom-table">
        
    <ng-template pTemplate="header">
      <tr class="custom-header">
        <th style="width: 80px;" class="text-center">Imagen</th>
        <th style="width: 250px;">Título</th>
        <th>Resumen</th>
        <th class="text-center" style="width: 80px;">Posición</th>
        <th class="text-center" style="width: 120px;">Fecha</th>
        <th class="text-center" style="width: 200px;">Acciones</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-page>
      <tr class="custom-row">
        <td class="text-center">
          <img *ngIf="page.idImagen" [src]="getImagenUrl(page.idImagen)" alt="Imagen" class="img-thumbnail" style="max-width: 60px; max-height: 60px;" />
          <span *ngIf="!page.idImagen" class="text-muted">-</span>
        </td>
        <td>{{ page.titulo }}</td>
        <td class="text-truncate" style="max-width: 300px;">{{ page.resumen }}</td>
        <td class="text-center">
          <span 
            class="position-indicator" 
            [ngClass]="page.posicion === 1 ? 'bg-primary' : 'bg-danger'"
            [pTooltip]="page.posicion === 1 ? 'Noticias' : 'Información Destacada'"
            tooltipPosition="top">
          </span>
        </td>
        <td class="text-center">{{ page.fecha | date: 'dd/MM/yyyy' }}</td>
        <td>
          <div style="display: flex; justify-content: center; align-items: center; gap: 0.5rem;">
            <i 
              class="pi pi-chevron-up action-icon text-warning fw-bold" 
              (click)="cambiarOrden(page.id, 'up')" *ngIf="permisoEditar | async"
              pTooltip="Subir" 
              tooltipPosition="top"
              [ngClass]="{'disabled-icon': pages[0].id === page.id}"
              [style.pointerEvents]="pages[0].id === page.id ? 'none' : 'auto'"
              [style.opacity]="pages[0].id === page.id ? 0.5 : 1"
            ></i>
            
            <i 
              class="pi pi-chevron-down action-icon text-warning fw-bold" 
              (click)="cambiarOrden(page.id, 'down')" *ngIf="permisoEditar | async"
              pTooltip="Bajar" 
              tooltipPosition="top"
              [ngClass]="{'disabled-icon': pages[pages.length - 1].id === page.id}"
              [style.pointerEvents]="pages[pages.length - 1].id === page.id ? 'none' : 'auto'"
              [style.opacity]="pages[pages.length - 1].id === page.id ? 0.5 : 1"
            ></i>

            <i class="pi pi-book action-icon create-icon text-primary" 
                (click)="detalles(page.id)" 
                pTooltip="Detalles" 
                tooltipPosition="top"></i>
            <i class="pi pi-pencil action-icon edit-icon" 
                (click)="editar(page.id)"  *ngIf="permisoEditar | async"
                pTooltip="Editar" 
                tooltipPosition="top"></i>
            <i class="pi pi-trash action-icon delete-icon" 
                (click)="confirmDelete($event, page.id)" 
                pTooltip="Eliminar"  *ngIf="permisoEliminar | async"
                tooltipPosition="top"></i>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div class="row">
    <div class="col-12 text-center">
      <button (click)="anterior()" class="btn button-secondary btn-lg add-button text-white me-2" type="button">
        <i class="pi pi-chevron-left"></i> Anterior
      </button>
    </div>
</div>

<p-dialog [(visible)]="displayModal" [modal]="true" [closable]="true" header="Agregar Noticia" [style]="{ width: '800px' }">
  <div class="row">
    <div class="col-4">
      <div class="info-carga mb-3">
        <div class="preview-imagen">
          <img *ngIf="imagenPreview" [src]="imagenPreview" alt="Vista previa" />
        </div>
        <div class="mt-2 w-100">
          <input type="file" id="fileInput" accept="image/*" (change)="onImageSelected($event)" hidden />
          <label for="fileInput" class="btn btn-warning btn-subir">
            <i class="pi pi-upload"></i>
            Cargar Imagen
          </label>
        </div>
      </div>
    </div>
    <div class="col-8">
        <div class="row mb-3 align-items-center">
          <div class="col-12 p-fluid">
            <label class="form-label fw-bold mb-0" for="posicion">Posición</label>
            <div class="btn-group btn-group-lg w-100" role="group" aria-label="Posición">
              <label class="btn btn-outline-primary" [class.active]="formulario.posicion == 1" [class.fw-bold]="formulario.posicion == 1">
                <input type="radio" name="posicionOptions" [(ngModel)]="formulario.posicion" [value]="1" autocomplete="off" /> Noticias
              </label>
              <label class="btn btn-outline-danger" [class.active]="formulario.posicion == 2" [class.fw-bold]="formulario.posicion == 2">
                <input type="radio" name="posicionOptions" [(ngModel)]="formulario.posicion" [value]="2" autocomplete="off" /> Información Destacada
              </label>
            </div>
          </div>
        </div>
      <div class="row mb-3 align-items-center">
        <div class="col-12 p-fluid">
          <label class="form-label fw-bold mb-0" for="titulo">Título</label>
          <input pInputText type="text" id="titulo" [(ngModel)]="formulario.titulo" class="w-100" />
          <div *ngIf="submitted && (formulario.titulo === '')" class="text-danger">
            Campo requerido
          </div>
        </div>
      </div>
      <div class="row mb-3 align-items-center">
        <div class="col-12 p-fluid">
          <label class="form-label fw-bold mb-0" for="resumen">Resumen</label>
          <textarea pInputTextarea id="resumen" [(ngModel)]="formulario.resumen" rows="2" class="w-100"></textarea>
        </div>
      </div>
      <div class="row mb-3 align-items-center">
        <div class="col-9 p-fluid">
          <label class="form-label fw-bold mb-0" for="fecha">Fecha</label>
          <p-calendar id="fecha" [(ngModel)]="formulario.fecha" appendTo="body" dateFormat="dd/mm/yy" class="w-100"></p-calendar>
        </div>
        <div class="col-3 p-fluid">
          <label class="form-label fw-bold mb-0" for="orden">Orden</label>
          <input type="number" id="orden" [(ngModel)]="formulario.orden" class="form-control w-100" min="0" />
        </div>
      </div>

      <div class="row mb-3 align-items-center">
        <div class="col-12 p-fluid">
          <label class="form-label fw-bold mb-0" for="enlace">Enlace a noticia externa</label>
          <div class="d-flex gap-2">
            <input pInputText type="url" id="enlace" [(ngModel)]="formulario.enlace" class="w-100" placeholder="https://ejemplo.com/noticia" (blur)="validarEnlace()" />
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="validarEnlace()" [disabled]="validandoEnlace">
              <i class="pi" [ngClass]="validandoEnlace ? 'pi-spin pi-spinner' : 'pi-link'"></i>
            </button>
          </div>
          <div *ngIf="enlaceError" class="text-danger mt-1">{{ enlaceError }}</div>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-12 p-fluid">
          <label class="form-label fw-bold mb-0" for="urlRecurso">Url Video</label>
          <div class="d-flex gap-2">
            <input pInputText type="url" id="urlRecurso" [(ngModel)]="formulario.urlRecurso" class="w-100" placeholder="https://youtube.com/watch?v=..." (blur)="validarUrlRecurso()" />
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="validarUrlRecurso()" [disabled]="validandoUrlRecurso">
              <i class="pi" [ngClass]="validandoUrlRecurso ? 'pi-spin pi-spinner' : 'pi-link'"></i>
            </button>
          </div>
          <div *ngIf="urlRecursoError" class="text-danger mt-1">{{ urlRecursoError }}</div>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-12 p-fluid d-flex align-items-center">
          <p-checkbox [(ngModel)]="targetNewTab" inputId="targetNewTab" [binary]="true" class="me-2"></p-checkbox>
          <label for="targetNewTab">Abrir enlaces en una pestaña nueva</label>
        </div>
      </div>
    </div>
  </div>

  <div class="w-100 d-flex justify-content-end mt-3">
    <button class="btn button-success btn-lg add-button" (click)="onSubmit()">
      <i class="pi pi-plus"></i> Guardar
    </button>
  </div>
</p-dialog>

<p-dialog [(visible)]="displayViewer" [modal]="true" [closable]="true" (onHide)="displayViewer = false" header="Vista Previa" [style]="{ width: '80vw', height: '80vh' }">
  <app-viewer [id]="this.id"></app-viewer>
</p-dialog>

<p-toast />

<app-msg-box
  [visible]="visible"
  [msgTexto]="msg"
  [msgTipo]="MsgTipo.Question"
  [msgBotones]="MsgBotones.EliminarCancelar"
  [width]="'25vw'"
  (close)="onHide($event)">
