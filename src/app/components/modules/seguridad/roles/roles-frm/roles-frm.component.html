<div class="p-4">
  <div class="container-fluid">
      <!-- Nombre -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="codigo">Código</label>
        </div>
        <div class="col-md-9">
          <input pInputText type="text" id="codigo" [(ngModel)]="formulario.codigo" class="w-100" />
          <div *ngIf="submitted && (!formulario.codigo || formulario.codigo.trim() === '')" class="text-danger">
              Campo requerido
          </div>
        </div>
      </div>

      <!-- Nombre -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="nombre">Nombre</label>
        </div>
        <div class="col-md-9">
          <input pInputText type="text" id="nombre" [(ngModel)]="formulario.nombre" class="w-100" />
          <div *ngIf="submitted && (!formulario.nombre || formulario.nombre.trim() === '')" class="text-danger">
              Campo requerido
          </div>
        </div>
      </div>

      <!-- Grupo -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="descripcion">Descripción</label>
        </div>
        <div class="col-md-9">
          <input pInputText type="text" id="descripcion" [(ngModel)]="formulario.descripcion" class="w-100" />
        </div>
      </div>

      <!-- Estado -->
      <div class="row align-items-center mb-5 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="estado">Estado</label>
        </div>
        <div class="col-md-9">
          <p-inputSwitch [(ngModel)]="formulario.estado" class="custom-switch" />
        </div>
      </div>

      <!-- Botones -->
      <div class="row mt-3">
        <div class="col-md-12 text-end">
          <button type="button" (click)="cancelar()" class="btn button-secondary btn-lg add-button me-2">Cancelar</button>
          <button type="button" (click)="onSubmit()" class="btn button-success btn-lg add-button">Guardar</button>
        </div>
      </div>
    </div>
</div>

<app-msg-box
  [visible]="visible"
  [msgTexto]="msg"
  [msgTipo]="MsgTipo.Success"
  [error]="error"
  [width]="'25vw'"
  (close)="onHide($event)">
