<div class="p-4">
  <div class="container-fluid">
      <!-- Nombre -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="nombre">Nombre</label>
        </div>
        <div class="col-md-9">
          <input pInputText type="text" id="nombre" [(ngModel)]="formulario.nombre" class="w-100" />
          <div *ngIf="submitted && (!formulario.nombre || formulario.nombre.trim() === '')" class="text-danger">
              Campo requerido
          </div>
        </div>
      </div>

      <!-- Grupo -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="grupo">Grupo</label>
        </div>
        <div class="col-md-9">
          <input pInputText type="text" id="grupo" [(ngModel)]="formulario.grupo" class="w-100" />
        </div>
      </div>

      <!-- Menú Padre -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label for="menu" class="fw-bold">Menú Padre</label>
        </div>
        <div class="col-md-9 p-fluid">
          <p-dropdown
            [(ngModel)]="selectedMenu"
            [options]="menus"
            [loading]="isLoadingMenus"
            optionLabel="nombre"
            [filter]="true"
            filterBy="nombre"
            [showClear]="true"
            id="menu"
            class="w-100"
            placeholder="Seleccione">
          </p-dropdown>
        </div>
      </div>

      <!-- Módulos -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="modulo">Módulos</label>
        </div>
        <div class="col-md-9 p-fluid">
          <p-dropdown
            [(ngModel)]="selectedModulo"
            [options]="modulos"
            [loading]="isLoadingModulos"
            optionLabel="nombre"
            [filter]="true"
            filterBy="nombre"
            [showClear]="true"
            id="modulo"
            class="w-100"
            placeholder="Seleccione">
          </p-dropdown>
        </div>
      </div>

      <!-- Orden -->
      <div class="row align-items-center mb-3 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="orden">Orden</label>
        </div>
        <div class="col-md-9">
          <input pInputText type="number" id="orden" [(ngModel)]="formulario.orden" class="w-100" />
          <div *ngIf="submitted && (formulario.orden === null || formulario.orden === undefined || formulario.orden === 0)" class="text-danger">
              Campo requerido
          </div>
        </div>
      </div>

      <!-- Estado -->
      <div class="row align-items-center mb-5 p-fluid">
        <div class="col-md-3">
          <label class="form-label fw-bold mb-0" for="estado">Estado</label>
        </div>
        <div class="col-md-9">
          <p-inputSwitch [(ngModel)]="formulario.estado" class="custom-switch" />
        </div>
      </div>

      <!-- Botones -->
      <div class="row mt-3">
        <div class="col-md-12 text-end">
          <button type="button" (click)="cancelar()" class="btn button-secondary btn-lg add-button me-2">Cancelar</button>
          <button type="button" (click)="onSubmit()" class="btn button-success btn-lg add-button">Guardar</button>
        </div>
      </div>
    </div>
</div>

<app-msg-box
  [visible]="visible"
  [msgTexto]="msg"
  [msgTipo]="MsgTipo.Success"
  [error]="error"
  [width]="'25vw'"
  (close)="onHide($event)">
