<p-menubar [model]="items" class="custom-menubar">
  <ng-template pTemplate="end">
    <div class="p-input-icon-left">
      <i class="pi pi-search"></i>
      <input
        type="text"
        pInputText
        placeholder="Buscar..."
        (input)="filtrar($event)"
        class="busqueda-menu"
      />
    </div>
  </ng-template>
</p-menubar>
