<div class="container my-4">
  <div class="row">
    <!-- COLUMNA PRINCIPAL: NOTICIAS -->
    <div class="col-lg-8 col-12">

      <h3 class="section-title mb-4">Últimas Noticias</h3>

      <!-- NOTICIAS DINÁMICAS (posicion = 1) -->
      <article *ngFor="let noticia of ultimasNoticias" class="news-item d-flex mb-4">
        <img *ngIf="noticia.idImagen || (noticia.imagen && noticia.imagen.file)"
          [src]="getImagenUrl(noticia)"
          [alt]="noticia.titulo"
          class="news-thumb me-3"
        />

        <div>
          <h5 class="news-title">
            {{ noticia.titulo }}
          </h5>

          <p class="news-summary">
            {{ noticia.resumen }}
          </p>

          <a *ngIf="noticia.enlace" [href]="noticia.enlace" [target]="noticia.target || '_self'" class="news-link">
            Leer más <i class="pi pi-arrow-right"></i>
          </a>
          <a *ngIf="!noticia.enlace" (click)="verNoticia(noticia)" class="news-link">
            Ver detalles <i class="pi pi-arrow-right"></i>
          </a>
        </div>
      </article>

      <!-- Mensaje si no hay noticias -->
      <div *ngIf="ultimasNoticias.length === 0" class="text-muted">
        No hay noticias disponibles.
      </div>

    </div>

    <!-- COLUMNA COMPLEMENTARIA -->
    <div class="col-lg-4 col-12 mt-5 mt-lg-0">

      <h3 class="section-title mb-3">Información Destacada</h3>

      <!-- INFORMACIÓN DESTACADA DINÁMICA (posicion = 2) -->
      <div *ngFor="let info of informacionDestacada" class="side-card">
        <h6 class="side-card-title">{{ info.titulo }}</h6>

        <!-- VIDEO: Miniatura con botón -->
        <div *ngIf="info.urlRecurso" class="video-thumbnail-container mb-2" (click)="abrirVideo(info)">
          <img [src]="getVideoThumbnail(info.urlRecurso)" [alt]="info.titulo" class="video-thumbnail" />
          <div class="video-play-overlay">
            <i class="pi pi-play-circle"></i>
          </div>
        </div>
        <a *ngIf="info.urlRecurso" class="btn btn-outline-primary w-100 mb-2" (click)="abrirVideo(info)" style="cursor: pointer;">
          <i class="pi pi-play me-2"></i> Ver video
        </a>

        <!-- IMAGEN si no tiene video pero tiene imagen -->
        <img *ngIf="!info.urlRecurso && info.idImagen"
          [src]="getImagenUrl(info)"
          [alt]="info.titulo"
          class="img-fluid rounded mb-2"
        />

        <p *ngIf="info.resumen" class="small text-muted">
          {{ info.resumen }}
        </p>

        <a *ngIf="info.enlace && !info.urlRecurso" [href]="info.enlace" [target]="info.target || '_self'" class="btn btn-outline-primary w-100">
          Más información
        </a>
        <a *ngIf="!info.enlace && !info.urlRecurso" (click)="verNoticia(info)" class="btn btn-outline-primary w-100" style="cursor: pointer;">
          Ver detalles
        </a>
      </div>

      <!-- Mensaje si no hay información destacada -->
      <div *ngIf="informacionDestacada.length === 0" class="text-muted">
        No hay información destacada disponible.
      </div>

    </div>
  </div>
</div>

<!-- Modal para reproducir video -->
<p-dialog 
  [(visible)]="displayVideoModal" 
  [modal]="true" 
  [closable]="true" 
  [header]="currentVideoTitle"
  [style]="{ width: '80vw', maxWidth: '900px' }"
  (onHide)="cerrarVideoModal()">
  <div class="video-modal-content">
    <iframe 
      *ngIf="currentVideoUrl"
      [src]="currentVideoUrl"
      class="w-100"
      style="aspect-ratio: 16/9; border: none;"
      allowfullscreen>
    </iframe>
  </div>
</p-dialog>
