<section class="news-section mb-5">
    <div class="row">
          <!-- Noticia Principal -->
        <div class="col-md-12 mb-4">
            <div class="card-body">
                <div class="news-meta mb-3 d-flex align-items-center">
                    <span class="text-muted"><i class="bi bi-calendar me-1"></i>{{noticia?.fecha | date:'d \'de\' MMMM, y'}}</span>
                </div>
                <div *ngFor="let item of noticia?.detalles; let i = index">
                    <div class="single-image-viewer text-center mb-3" *ngIf="item.tipo === TipoNoticia.Imagen || item.tipo === TipoNoticia.ImagenUrl">
                        <img [src]="cargarUrl(item.id!)"
                            class="adaptive-image mx-auto d-block"
                            (load)="onImageLoad()">
                    </div>
                    <div class="card-text-container  word-break-fix mb-3" *ngIf="item.tipo === TipoNoticia.Texto">
                        <span [innerHTML]="item.contenido"></span>
                    </div>
                    <h3 class="mb-3" *ngIf="item.tipo === TipoNoticia.Titulo">{{item.contenido}}</h3>
                    <!-- cargar videos -->
                    <div class="row justify-content-center align-items-center">
                        <div class="col-12 d-flex justify-content-center" *ngIf="item.tipo === TipoNoticia.Video">
                            <div class="video-container mb-3">
                                <iframe
                                    [src]="sanitizarURL(item.url || '')"
                                    width="560"
                                    height="315"
                                    frameborder="0"
                                    allowfullscreen
                                ></iframe>
                            </div>
                        </div>
                    </div>
                    <app-viewerPBI *ngIf="item.tipo === TipoNoticia.Tablero && item.idTablero !== null" [id]="item.idTablero!"></app-viewerPBI>
                    <!-- cargar audios -->
                    <div class="audio-container mb-3" *ngIf="item.tipo === TipoNoticia.Audio">
                        <audio controls>
                            <source [src]="cargarUrl(item.id!)" type="audio/mpeg">
                            Tu navegador no soporta el elemento de audio.
                        </audio>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
