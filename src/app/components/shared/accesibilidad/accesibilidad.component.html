<div class="accessibility-panel">
  <button (click)="toggleContrast()">Contraste +</button>
  <button (click)="highlightLinks()">Resaltar enlaces</button>
  <button (click)="increaseText()">Agrandar texto</button>
  <button (click)="adjustLetterSpacing()">Espaciado de texto</button>
  <button (click)="stopAnimations()">Detener animaciones</button>
  <button (click)="hideImages()">Ocultar imágenes</button>
  <button (click)="toggleDyslexiaFont()">Apto para dislexia</button>
  <button (click)="changeCursor()">Cursor</button>
  <button (click)="showInfo()">Información</button>
  <button (click)="adjustLineHeight()">Altura de la línea</button>
  <button (click)="alignText()">Texto alineado</button>
  <button (click)="adjustSaturation()">Saturación</button>
</div>
