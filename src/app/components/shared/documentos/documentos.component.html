<section class="documents-section mb-3" *ngIf="documents && documents.length > 0">
    <div class="row">
        <div class="col-5 mb-4">
            <h1 class="mb-4"><i class="bi bi-files me-2"></i>Documentos Anexos</h1>
            <p class="mb-4">En esta sección encontrará los documentos necesarios para realizar su trámite.</p>
        </div>  
        <div class="col-7 mb-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th width="15%">Identificador</th>
                            <th>Nombre documento</th>
                            <th width="15%">Formato</th>
                            <th class="text-center" width="10%">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="table-light">
                        <tr *ngFor="let document of documents">
                            <td class="fw-bold">{{ document.codigo }}</td>
                            <td>{{ document.nombre }}</td>
                            <td>
                                <span class="text-center text-dark">
                                <i class="bi bi-filetype-{{ document.formato | lowercase }} me-1"></i>{{ document.formato | uppercase }}
                                </span>
                            </td>
                            <td class="text-center">
                                <i class="pi pi-eye text-warning" (click)="descargar(document.id!)" pTooltip="Ver" tooltipPosition="top" style="font-size: 1.4rem;"></i>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>  
    </div>
</section>
